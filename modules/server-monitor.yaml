name: "服务器监控"
description: "服务器监控小组件，通过 SSH 获取服务器状态，支持所有 Widget 尺寸"

env_schema:
  host:
    name: 主机地址
    description: SSH 服务器地址
    default_value: ""
  port:
    name: 端口
    description: SSH 端口号
    default_value: "22"
  username:
    name: 用户名
    description: SSH 登录用户名
    default_value: "root"
  password:
    name: 密码
    description: "SSH 密码（与私钥二选一）"
    default_value: ""
  privateKeyBase64:
    name: 私钥 Base64（推荐）
    description: "完整 PEM 私钥的单行 Base64；避免粘贴时换行损坏"
    default_value: ""
  privateKey:
    name: 原始私钥（兼容）
    description: "完整 PEM 私钥；推荐优先使用上面的 Base64 字段"
    default_value: ""
  passphrase:
    name: 私钥口令
    description: "私钥设置了口令时填写；无口令请留空"
    default_value: ""

scriptings:
- generic:
    name: 服务器监控
    script_url: https://raw.githubusercontent.com/egerndaddy/quick-start/main/modules/server-monitor.js

widgets:
- name: 服务器监控
  script_name: 服务器监控
